# SPAWN ----------------
bind=SUPER,space,spawn,~/dotfiles/assets/scripts/rofi_launcher_toggle
bind=SUPER,T,spawn,ghostty
bind=SUPER,Y,spawn,vivaldi
bind=SUPER,G,spawn,godot
bind=SUPER,K,spawn,krita
bind=SUPER,Z,spawn_shell,qs -p /home/fwz/Claude/Nino1 ipc call nino1 cycleModes
bind=SUPER,X,spawn_shell,qs -p /home/fwz/Claude/Nino1 ipc call nino1 switchMode contextual
bind=SUPER,C,spawn_shell,qs -p /home/fwz/Claude/Nino1 ipc call nino1 togglePinned true
bind=SUPER,V,spawn_shell,qs -p /home/fwz/Claude/Nino1 ipc call nino1 back
bind=SUPER,A,spawn_shell,qs -p /home/fwz/Claude/Nino1 ipc call shell reloadConfig
bind=SUPER,S,spawn_shell,qs -p /home/fwz/Claude/Nino1 ipc call shell restart
bind=SUPER,D,spawn_shell,qs -p /home/fwz/Claude/Nino1 ipc call nino1 toggleAngle

# --------------------------------

# CLIENT MANAGEMENT ----------------

# KILL --------
# kill client
bind=SUPER,q,killclient
mousebind=SUPER+Alt,btn_middle,killclient
# force kill client
bind=SUPER+ALT,q,killclient,force
# --------------------------------

# FOCUS --------
# focus neighbour client
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
# focus stack
bind=SUPER+ALT,Up,focusstack,prev
bind=SUPER+ALT,Down,focusstack,next
# focus group
bind=SUPER+ALT,Left,groupfocus,prev
bind=SUPER+ALT,Right,groupfocus,next
# focus tag (num row)
bind=SUPER,0,toggle_special_tag
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
# focus tag (num pad)
bind=SUPER,KP_0,toggle_special_tag
bind=SUPER,KP_1,view,1,0
bind=SUPER,KP_2,view,2,0
bind=SUPER,KP_3,view,3,0
# focus monitor (num row)
bind=SUPER,4,focusmon,name:DVI-D-1
bind=SUPER,5,focusmon,name:DP-1
bind=SUPER,6,focusmon,name:HDMI-A-1
# focus monitor (num pad)
bind=SUPER,KP_4,focusmon,name:DVI-D-1
bind=SUPER,KP_5,focusmon,name:DP-1
bind=SUPER,KP_6,focusmon,name:HDMI-A-1
# --------------------------------

# MOVE CLIENT --------
# move client
mousebind=SUPER,btn_left,moveresize,curmove
# exchange client with neighbor client
bind=SUPER+CTRL,Up,exchange_client,up
bind=SUPER+CTRL,Down,exchange_client,down
bind=SUPER+CTRL,Left,exchange_client,left
bind=SUPER+CTRL,Right,exchange_client,right
# move client to tag (num row)
bind=SUPER+CTRL,0,tag,0,0
bind=SUPER+CTRL,1,tag,1,0
bind=SUPER+CTRL,2,tag,2,0
bind=SUPER+CTRL,3,tag,3,0
# move client to tag (num pad)
bind=SUPER+CTRL,KP_0,tag,0,0
bind=SUPER+CTRL,KP_1,tag,1,0
bind=SUPER+CTRL,KP_2,tag,2,0
bind=SUPER+CTRL,KP_3,tag,3,0
# move client to monitor (num row)
bind=SUPER+CTRL,4,tagmon,name:DVI-D-1,0
bind=SUPER+CTRL,5,tagmon,name:DP-1,0
bind=SUPER+CTRL,6,tagmon,name:HDMI-A-1,0
# move client to monitor (num pad)
bind=SUPER+CTRL,KP_4,tagmon,name:DVI-D-1,0
bind=SUPER+CTRL,KP_5,tagmon,name:DP-1,0
bind=SUPER+CTRL,KP_6,tagmon,name:HDMI-A-1,0
# --------------------------------

# GROUP --------
# tab group
bind=SUPER,Delete,groupjoin,left
bind=SUPER,Next,groupjoin,right
bind=SUPER,Home,groupjoin,up
bind=SUPER,End,groupjoin,down
# leave tab group
bind=SUPER+ALT,Home,groupleave
# stack clients (scroller only)
bind=SUPER+CTRL+ALT,Left,scroller_stack,left
bind=SUPER+CTRL+ALT,Right,scroller_stack,right
bind=SUPER+CTRL+ALT,Up,scroller_stack,up
bind=SUPER+CTRL+ALT,Down,scroller_stack,down
# --------------------------------

# RESIZE CLIENT --------
# maximize
bind=SUPER,Insert,togglemaximizescreen,
mousebind=SUPER,btn_middle,togglemaximizescreen,0
# fullscreen
bind=SUPER,Prior,togglefakefullscreen,
# descrete manual resize
bind=SUPER+SHIFT,Left,resizewin,-10,+0
bind=SUPER+SHIFT,Right,resizewin,+10,+0
bind=SUPER+SHIFT,Up,resizewin,+0,-10
bind=SUPER+SHIFT,Down,resizewin,+0,+10
# mouse resize
mousebind=SUPER,btn_right,moveresize,curresize
# --------------------------------

# CLIENT STATUS --------
# floating
bind=SUPER,KP_7,togglefloating,
# global
bind=SUPER,KP_8,toggleglobal,
# overlay 
bind=SUPER,KP_9,toggleoverlay,
# --------------------------------

# LAYOUTS --------
# overview
bind=SUPER,Tab,overcircle,next
# set layout
bind=SUPER+SHIFT,KP_1,setlayout,dwindle
bind=SUPER+SHIFT,KP_2,setlayout,grid
bind=SUPER+SHIFT,KP_3,setlayout,deck
bind=SUPER+SHIFT,KP_4,setlayout,scroller
bind=SUPER+SHIFT,KP_5,setlayout,vertical_scroller
bind=SUPER+SHIFT,KP_6,setlayout,monocle
bind=SUPER+SHIFT,KP_7,setlayout,tile
bind=SUPER+SHIFT,KP_8,setlayout,vertical_tile
bind=SUPER+SHIFT,KP_9,setlayout,center_tile
bind=SUPER+SHIFT,KP_0,setlayout,fair
# --------------------------------

# SCRATCHPAD --------
bind=SUPER,Backspace,minimized,
bind=SUPER,Return,restore_minimized,0
bind=SUPER+ALT,space,toggle_scratchpad
# --------------------------------

# SYSTEM --------
# quit
bind=SUPER+CTRL,q,quit
# reload config
bind=SUPER,r,reload_config
# --------------------------------
