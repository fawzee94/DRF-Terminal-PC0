# OPTIONS --------
scratchpad_cross_monitor=1
single_scratchpad=0
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
# --------------------------------

# NAMED SCRATCHPADS --------
# ghostty
windowrule=isnamedscratchpad:1,animation_type_open:zoom,animation_type_close:zoom,width:600,height:1000,title:ghostty-scratch
bind=SUPER+ALT,KP_1,toggle_named_scratchpad,none,ghostty-scratch,ghostty --title=ghostty-scratch

# files
windowrule=isnamedscratchpad:2,appid:org.gnome.Nautilus
bind=SUPER+ALT,KP_2,toggle_named_scratchpad,org.gnome.Nautilus,none,nautilus

# drawy
windowrule=isnamedscratchpad:3,appid:org.kde.drawy
bind=SUPER+ALT,KP_3,toggle_named_scratchpad,org.kde.drawy,none,drawy
# -------------------------------
