# GENERAL SETTINGS --------------------------------

# AUTOSTART ----------------
# STARTUP --------
exec-once=~/dotfiles/assets/scripts/startup
exec-once=geany
exec-once=vivaldi
# CONFIG RELOAD --------
#exec=foo
# --------------------------------

# INPUT ----------------

# KEYBOARD --------
repeat_rate=25
repeat_delay=600
numlockon=1
xkb_rules_layout=gb
#xkb_rules_rules=
#xkb_rules_model=
#xkb_rules_variant=
#xkb_rules_options=
# --------------------------------

# MOUSE (need relogin to apply) --------
mouse_natural_scrolling=0
mouse_accel_profile=2
mouse_accel_speed=0.0
mouse_left_handed=0
mouse_middle_button_emulation=0
mouse_scroll_method=1
mouse_scroll_button=274
mouse_click_method=1
mouse_send_events_mode=0
axis_scroll_factor=1.0
# --------------------------------

# TRACKPAD (need relogin to apply) --------
mouse_natural_scrolling=0
mouse_accel_profile=2
mouse_accel_speed=0.0
mouse_left_handed=0
mouse_middle_button_emulation=0
mouse_scroll_method=1
mouse_scroll_button=274
mouse_click_method=1
mouse_send_events_mode=0
axis_scroll_factor=1.0
# --------------------------------

# MISC ----------------
# SYSTEM --------
xwayland_persistence=1
syncobj_enable=1
allow_lock_transparent=1
allow_shortcuts_inhibit=1
# BEHAVIOUR --------
# focus
focus_on_activate=1
sloppyfocus=1
# cursor
warpcursor=1
cursor_hide_timeout=0
cursor_hide_on_keypress=0
# dragging
drag_warp_cursor=1
drag_tile_to_tile=1
drag_tile_small=1
drag_corner=3
drag_tile_refresh_interval=8.0
drag_floating_refresh_interval=8.0
# monitors
focus_cross_monitor=1
exchange_cross_monitor=1
# tags
focus_cross_tag=0
view_current_to_back=1
tag_carousel=0
tag_num=3
tag_gather=0
# snap
enable_floating_snap=0
snap_distance=30
# borders
no_border_when_single=0
# idle inhibitor
idleinhibit_ignore_visible=0
# --------------------------------

# LAYOUTS ----------------

# SCROLLER --------
scroller_structs=20
scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=0
scroller_prefer_overspread=1
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_proportion_preset=0.5,0.8,1.0
scroller_ignore_proportion_single=1
# Requires scroller_ignore_proportion_single=0
scroller_default_proportion_single=1.0
# --------------------------------

# MASTER-STACK --------
new_is_master=0
default_mfact=0.57
default_nmaster=1
smartgaps=0
center_master_overspread=1
center_when_single_stack=0
# --------------------------------

# DWINDLE --------
dwindle_split_ratio=0.43
dwindle_smart_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=1
dwindle_smart_resize=1
dwindle_drop_simple_split=0
dwindle_manual_split=0
# --------------------------------

# OVERVIEW --------
enable_hotarea=0
hotarea_size=10
hotarea_corner=0
ov_tab_mode=0
overviewgappi=5
overviewgappo=60
# --------------------------------

# SCRATCHPADS ----------------
# options
scratchpad_cross_monitor=1
single_scratchpad=0
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
# NAMED SCRATCHPADS --------
# ghostty
windowrule=isnamedscratchpad:1,width:600,height:1000,title:ghostty-scratch
bind=SUPER+ALT,KP_1,toggle_named_scratchpad,none,ghostty-scratch,ghostty --title=ghostty-scratch
# files
windowrule=isnamedscratchpad:2,appid:org.gnome.Nautilus
bind=SUPER+ALT,KP_2,toggle_named_scratchpad,org.gnome.Nautilus,none,nautilus
# drawy
windowrule=isnamedscratchpad:3,appid:org.kde.drawy
bind=SUPER+ALT,KP_3,toggle_named_scratchpad,org.kde.drawy,none,drawy
# -------------------------------

# THEME ----------------

# DIMENSIONS --------
# gaps
gappih=5
gappiv=5
gappoh=10
gappov=10
# --------------------------------

# COLORS --------
rootcolor=0x444444ff
bordercolor=0x475b33ff
dropcolor=0x00000033
splitcolor=0xad401fff
focuscolor=0x87af5fff
urgentcolor=0xeb441eff
maximizescreencolor=0x87af5fff
scratchpadcolor=0x58bb83ff
globalcolor=0xb5b762ff
overlaycolor=0xe8b368ff
# --------------------------------

# TAB GROUPS --------
group_bar_height=18
# text color
group_bar_decorate_fg_color=0xffffffff
# background color
group_bar_decorate_bg_color=0x282828ff
# text color for focus
group_bar_decorate_focus_fg_color=0x000000ff
# background color for focus
group_bar_decorate_focus_bg_color=0x87af5fff
# border color
group_bar_decorate_border_color=0x87af5fff
# border width
group_bar_decorate_border_width=1
# corner radius
group_bar_decorate_corner_radius=4
# horizontal padding
group_bar_decorate_padding_x=0
# vertical padding
group_bar_decorate_padding_y=2
# font set
group_bar_decorate_font_desc=monospace,Bold,0
# --------------------------------

# MOUSE --------
cursor_size=24
# --------------------------------

# CLIENT EFFECTS ----------------

# BORDERS --------
# size
borderpx=1
# radius
border_radius=16
no_radius_when_single=0
# --------------------------------

# OPACITY --------
focused_opacity=0.80
unfocused_opacity=0.6
# --------------------------------

# BLUR --------
# active
blur=1
# options
blur_layer=1
blur_optimized=1
# params
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2
# --------------------------------

# SHADOWS --------
# active
shadows = 1
# options
layer_shadows = 0
shadow_only_floating = 1
# params
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff
# --------------------------------

# ANIMATION ----------------
# active
animations=1
# options
layer_animations=1
# type
animation_type_open=zoom
animation_type_close=zoom
layer_animation_type_open=zoom
layer_animation_type_close=zoom
# fade
animation_fade_in=1
animation_fade_out=1
# tag
tag_animation_direction=1
# zoom options
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
# fade options
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
# duration
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=1000
# custom curves
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1
# --------------------------------

# RULES ----------------

# CLIENTS --------

# Vivaldi
windowrule=noblur:1,focused_opacity:1,unfocused_opacity:1,appid:vivaldi-stable
# Brave
windowrule=noblur:1,focused_opacity:1,unfocused_opacity:1,appid:brave-browser
# FreeTube
windowrule=noblur:1,focused_opacity:1,unfocused_opacity:1,appid:freetube

# TAGS --------
tagrule=id:1,layout_name:dwindle
tagrule=id:2,layout_name:dwindle
tagrule=id:3,layout_name:dwindle
# --------------------------------

# MONITORS --------
#PC0
monitorrule=make:Dell Inc.,x:0,y:180
monitorrule=make:JRY,x:1440,y:0
monitorrule=make:UGD,x:1440,y:1080

#LT0
monitorrule=make:BOE,x:0,y:1080
monitorrule=make:Technical Concepts Ltd,width:1920,height:1080,refresh:60,x:0,y:0
# --------------------------------

# LAYERS --------
#layerrule=animation_type_open:slide,animation_type_close:fade,noblur:1,layer_name:rofi
# --------------------------------

# KEY BINDINGS --------------------------------

# SPAWN ----------------
bind=SUPER,space,spawn,~/dotfiles/assets/scripts/rofi_launcher_toggle
bind=SUPER,T,spawn,ghostty
bind=SUPER,V,spawn,vivaldi
bind=SUPER,G,spawn,godot
bind=SUPER,K,spawn,krita
# --------------------------------

# CLIENT MANAGEMENT ----------------

# KILL --------
# kill client
bind=SUPER,q,killclient
mousebind=SUPER+Alt,btn_middle,killclient
# force kill client
bind=SUPER+ALT,q,killclient,force
# --------------------------------

# FOCUS --------
# focus neighbour client
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
# focus stack
bind=SUPER+ALT,Up,focusstack,prev
bind=SUPER+ALT,Down,focusstack,next
# focus group
bind=SUPER+ALT,Left,groupfocus,prev
bind=SUPER+ALT,Right,groupfocus,next
# focus tag (num row)
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
# focus tag (num pad)
bind=SUPER,KP_1,view,1,0
bind=SUPER,KP_2,view,2,0
bind=SUPER,KP_3,view,3,0
# focus monitor (num row)
bind=SUPER,4,focusmon,name:DVI-D-1
bind=SUPER,5,focusmon,name:DP-1
bind=SUPER,6,focusmon,name:HDMI-A-1
# focus monitor (num pad)
bind=SUPER,KP_4,focusmon,name:DVI-D-1
bind=SUPER,KP_5,focusmon,name:DP-1
bind=SUPER,KP_6,focusmon,name:HDMI-A-1
# --------------------------------

# MOVE CLIENT --------
# move client
mousebind=SUPER,btn_left,moveresize,curmove
# exchange client with neighbor client
bind=SUPER+CTRL,Up,exchange_client,up
bind=SUPER+CTRL,Down,exchange_client,down
bind=SUPER+CTRL,Left,exchange_client,left
bind=SUPER+CTRL,Right,exchange_client,right
# move client to tag (num row)
bind=SUPER+CTRL,1,tag,1,0
bind=SUPER+CTRL,2,tag,2,0
bind=SUPER+CTRL,3,tag,3,0
# move client to tag (num pad)
bind=SUPER+CTRL,KP_1,tag,1,0
bind=SUPER+CTRL,KP_2,tag,2,0
bind=SUPER+CTRL,KP_3,tag,3,0
# move client to monitor (num row)
bind=SUPER+CTRL,4,tagmon,name:DVI-D-1,0
bind=SUPER+CTRL,5,tagmon,name:DP-1,0
bind=SUPER+CTRL,6,tagmon,name:HDMI-A-1,0
# move client to monitor (num pad)
bind=SUPER+CTRL,KP_4,tagmon,name:DVI-D-1,0
bind=SUPER+CTRL,KP_5,tagmon,name:DP-1,0
bind=SUPER+CTRL,KP_6,tagmon,name:HDMI-A-1,0
# --------------------------------

# GROUP --------
# tab group
bind=SUPER,Delete,groupjoin,left
bind=SUPER,Next,groupjoin,right
bind=SUPER,Home,groupjoin,up
bind=SUPER,End,groupjoin,down
# leave tab group
bind=SUPER,KP_0,groupleave
bind=SUPER,0,groupleave
# stack clients (scroller only)
bind=SUPER+CTRL+ALT,Left,scroller_stack,left
bind=SUPER+CTRL+ALT,Right,scroller_stack,right
bind=SUPER+CTRL+ALT,Up,scroller_stack,up
bind=SUPER+CTRL+ALT,Down,scroller_stack,down
# --------------------------------

# RESIZE CLIENT --------
# maximize
bind=SUPER,Insert,togglemaximizescreen,
mousebind=SUPER,btn_middle,togglemaximizescreen,0
# fullscreen
bind=SUPER,Prior,togglefakefullscreen,
# descrete manual resize
bind=SUPER+SHIFT,Left,resizewin,-10,+0
bind=SUPER+SHIFT,Right,resizewin,+10,+0
bind=SUPER+SHIFT,Up,resizewin,+0,-10
bind=SUPER+SHIFT,Down,resizewin,+0,+10
# mouse resize
mousebind=SUPER,btn_right,moveresize,curresize
# --------------------------------

# CLIENT STATUS --------
# floating
bind=SUPER,KP_7,togglefloating,
# global
bind=SUPER,KP_8,toggleglobal,
# overlay 
bind=SUPER,KP_9,toggleoverlay,
# --------------------------------

# LAYOUTS --------
# overview
bind=SUPER,Tab,toggleoverview,
# set layout
bind=SUPER+SHIFT,KP_1,setlayout,dwindle
bind=SUPER+SHIFT,KP_2,setlayout,grid
bind=SUPER+SHIFT,KP_3,setlayout,deck
bind=SUPER+SHIFT,KP_4,setlayout,scroller
bind=SUPER+SHIFT,KP_5,setlayout,vertical_scroller
bind=SUPER+SHIFT,KP_6,setlayout,monocle
bind=SUPER+SHIFT,KP_7,setlayout,tile
bind=SUPER+SHIFT,KP_8,setlayout,vertical_tile
bind=SUPER+SHIFT,KP_9,setlayout,center_tile
bind=SUPER+SHIFT,KP_0,setlayout,fair
# --------------------------------

# SCRATCHPAD --------
bind=SUPER,Backspace,minimized,
bind=SUPER,Return,restore_minimized,0
bind=SUPER+ALT,space,toggle_scratchpad
# --------------------------------

# SYSTEM --------
# quit
bind=SUPER+CTRL,q,quit
# reload config
bind=SUPER,r,reload_config
# --------------------------------
